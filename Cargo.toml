[workspace]
members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.test]
# The solver tests run thousands of iterations; unoptimised they take minutes.
opt-level = 2

[profile.release]
# The solver is CPU-bound; trade compile time for speed.
lto = "fat"
codegen-units = 1
panic = "abort"
