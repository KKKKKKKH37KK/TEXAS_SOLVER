[package]
name = "hexas-cli"
description = "Native front end for tests and benchmarks (solve / bench / compare)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hexas"
path = "src/main.rs"

# No clap: its windows-sys dependency needs MinGW's dlltool on the GNU toolchain.
[dependencies]
hexas-core = { path = "../core" }
# Only to cap the solver's thread count (--threads).
rayon = "1"
