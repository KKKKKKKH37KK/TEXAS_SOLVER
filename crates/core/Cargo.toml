[package]
name = "hexas-core"
description = "Card model, hand evaluator and CFR solver core (pure Rust, no IO)"
version.workspace = true
edition.workspace = true

[dependencies]
# Parallel chance nodes. In the browser (M3) this runs on wasm-bindgen-rayon.
rayon = "1"
# Spot specs and result-file headers.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
